name: Build elpAudio  
  
on:  
  push:  
    tags:  
      - 'v*'  
  workflow_dispatch:  
  
permissions:  
  contents: write  
  
jobs:  
  build:  
    runs-on: windows-2022  
  
    steps:  
      - uses: actions/checkout@v4  
  
      - name: Install Game Maker 8.2  
        shell: pwsh  
        run: Start-Process -FilePath "${{ github.workspace }}\Game+Maker+8.2+Setup.exe" -ArgumentList "/S" -Wait  
  
      - name: Build elpAudio  
        working-directory: elpAudio  
        shell: pwsh  
        run: '& "$env:APPDATA\GameMaker8.2\GameMaker.exe" elpAudio.gm82 --build elpAudio.exe'  
  
      - name: Package release  
        working-directory: elpAudio  
        shell: cmd  
        run: 7z a elpAudio.zip data\ico.ico LICENSE.txt windows.dll music_examples\ themes\astronaut themes\clacon2.ttf themes\sourcesans.ttf data\elpAudioSettings.exe data\vars.txt elpAudio.exe visualisers\default_*.vis visualisers\fire3d.vis visualisers\fountain.vis visualisers\playlist.vis visualisers\intmain3k.vis visualisers\img\noalbum.png lib_audio.dll fmodex.dll README.txt -xr!*.m3u -xr!*.m3u8 -xr!*.zip plugins\README.txt plugins\test.plg plugins\ea_monitors.dll plugins\monitor.plg themes\default themes\light themes\compact themes\readme.txt -xr!themes\*\playlist\  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: elpAudio-${{ github.ref_name }}  
          path: elpAudio/elpAudio.zip  
          if-no-files-found: error  
  
      - name: Create GitHub Release  
        if: startsWith(github.ref, 'refs/tags/')  
        uses: softprops/action-gh-release@v2  
        with:  
          files: elpAudio/elpAudio.zip  
          name: elpAudio ${{ github.ref_name }}  
          generate_release_notes: true
